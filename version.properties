# The single source of truth for the app's version.
#
# versionName is what people see and comes from the release branch: release/1.2.0
# publishes 1.2.0. versionCode is what Android compares when installing an update, so
# it only ever goes up. CI rewrites both on a release branch and commits the result —
# do not bump them by hand there, or the two will fight.
versionName=1.0.0
versionCode=1
