name: Release

# A release branch is what publishes. Cutting release/1.2.0 off develop is the whole
# trigger: this workflow verifies the branch, stamps the version, builds the signed APK,
# attaches it to a GitHub Release and then opens the two merge-back pull requests.
#
# release/** is not a trigger in ci.yml — the `verify` job below calls that workflow
# instead, so a release branch runs the test suite once, here, rather than in a second
# pipeline racing this one.
on:
  push:
    branches: ['release/**']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Quoted on purpose — see the same block in ci.yml.
  GRADLE_ARGS: >-
    --no-daemon --parallel
    -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    -Dkotlin.daemon.jvmargs=-Xmx2g

jobs:
  # Tests, lint, detekt and the secret scan, from the one workflow that defines them.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
      # write, not read: the called workflow's `dependencies` job asks for write, and a
      # caller must grant at least what every nested job requests — even one that is
      # skipped on this event (that job runs on pull requests only).
      pull-requests: write
      security-events: write

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump is pushed back to this branch, so the checkout needs a
          # token that may write and a ref rather than a detached commit.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version from the branch name
        id: version
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#release/}"
          # Anything else is a typo, and a typo must not reach the Releases page.
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::branch must be release/<major>.<minor>.<patch>, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          if gh release view "v$name" >/dev/null 2>&1; then
            echo "::error::v$name is already released — cut a new release branch"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stamp version.properties
        id: stamp
        run: |
          set -euo pipefail
          name='${{ steps.version.outputs.name }}'
          code=$(( $(grep '^versionCode=' version.properties | cut -d= -f2) + 1 ))
          sed -i "s/^versionName=.*/versionName=$name/" version.properties
          sed -i "s/^versionCode=.*/versionCode=$code/" version.properties
          echo "code=$code" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.properties
          # [skip ci] keeps this push from starting the whole workflow over again.
          git commit -m "chore: release $name ($code) [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"

      # The signing material and the backend credentials only exist as secrets. Writing
      # them here keeps build.gradle.kts with exactly one way to find them.
      - name: Restore signing and backend configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD BACKEND_URL BACKEND_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "::error::secret $required is not set"
              exit 1
            fi
          done
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/dosmotr-release.jks
          # Written with a heredoc so nothing here lands in the log.
          cat > local.properties <<PROPS
          backend.url=$BACKEND_URL
          backend.token=$BACKEND_TOKEN
          release.storeFile=keystore/dosmotr-release.jks
          release.storePassword=$KEYSTORE_PASSWORD
          release.keyAlias=$KEY_ALIAS
          release.keyPassword=$KEY_PASSWORD
          PROPS

      - name: Run unit tests
        run: ./gradlew ${{ env.GRADLE_ARGS }} testDirectReleaseUnitTest

      # `direct` is the flavour that goes on the Releases page: it carries the donation
      # block, which is exactly what a store build may not have. The `store` APK is built
      # by whoever uploads it to RuStore/Google Play — feature-21 automates that side.
      - name: Build the release APK
        run: ./gradlew ${{ env.GRADLE_ARGS }} assembleDirectRelease

      # An unsigned or debug-signed APK installs fine on a fresh phone and then refuses
      # to update the real one, so it is worth failing the release over.
      - name: Verify the signature
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/direct/release/app-direct-release.apk
          mv app/build/outputs/apk/direct/release/app-direct-release.apk \
             "dosmotr-${{ steps.version.outputs.name }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.version.outputs.name }}" \
            --target "$GITHUB_REF_NAME" \
            --title "Досмотр ${{ steps.version.outputs.name }}" \
            --notes "Сборка ${{ steps.version.outputs.name }} (versionCode ${{ steps.stamp.outputs.code }})." \
            --generate-notes \
            "dosmotr-${{ steps.version.outputs.name }}.apk"

      - name: Drop the secrets from the workspace
        if: always()
        run: rm -f local.properties keystore/dosmotr-release.jks

  # The release branch has to land in both long-lived branches: master is what is published,
  # develop needs the versionCode bump CI just committed or the next release repeats it.
  # These are pull requests with auto-merge on rather than direct pushes, because a merge
  # into master or develop stays a reviewable event (see CLAUDE.md) — auto-merge only
  # decides *when* it lands, once the branch protection checks are green.
  merge-back:
    name: Merge into ${{ matrix.base }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # Sequential: master first, so develop does not get a merge-back of a release that
      # failed to reach master.
      max-parallel: 1
      fail-fast: false
      matrix:
        base: [master, develop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Open the pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ matrix.base }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail

          # checkout only fetched the release branch, so the base has to be asked for.
          git fetch origin "$BASE"
          # Nothing to merge means gh pr create would fail rather than no-op — which happens
          # whenever the base already contains every commit of the release branch.
          if [ "$(git rev-list --count "origin/$BASE..HEAD")" = 0 ]; then
            echo "::notice::$BASE already contains $GITHUB_REF_NAME"
            exit 0
          fi

          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
                  --base "$BASE" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$GITHUB_REF_NAME" \
              --base "$BASE" \
              --title "Release $VERSION → $BASE" \
              --body "Automated merge-back of \`$GITHUB_REF_NAME\` after v$VERSION was published.
          Includes the \`versionCode\` bump CI committed to the release branch.")
          fi
          echo "::notice::$BASE ← $url"

          # Needs "Allow auto-merge" in the repository settings; without it the PR is still
          # open and waiting, which is the same outcome minus the convenience.
          if ! gh pr merge "$url" --auto --merge; then
            echo "::warning::auto-merge could not be enabled for $url — merge it by hand"
          fi
