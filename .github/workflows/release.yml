name: Release

# A release branch is what publishes. Cutting release/1.2.0 off develop is the whole
# trigger: this workflow verifies the branch, stamps the version, builds the three signed
# artifacts (the `direct` APK for the Releases page, the `store` AAB for Google Play and the
# `store` APK for RuStore), attaches the `direct` one to a GitHub Release, keeps the other
# two as run artifacts for the manual upload, and then opens the two merge-back pull
# requests.
#
# release/** is not a trigger in ci.yml — the `verify` job below calls that workflow
# instead, so a release branch runs the test suite once, here, rather than in a second
# pipeline racing this one.
on:
  push:
    branches: ['release/**']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Quoted on purpose — see the same block in ci.yml.
  GRADLE_ARGS: >-
    --no-daemon --parallel
    -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    -Dkotlin.daemon.jvmargs=-Xmx2g

jobs:
  # Tests, lint, detekt and the secret scan, from the one workflow that defines them.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
      # write, not read: the called workflow's `dependencies` job asks for write, and a
      # caller must grant at least what every nested job requests — even one that is
      # skipped on this event (that job runs on pull requests only).
      pull-requests: write
      security-events: write

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump is pushed back to this branch, so the checkout needs a
          # token that may write and a ref rather than a detached commit.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version from the branch name
        id: version
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#release/}"
          # Anything else is a typo, and a typo must not reach the Releases page.
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::branch must be release/<major>.<minor>.<patch>, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          if gh release view "v$name" >/dev/null 2>&1; then
            echo "::error::v$name is already released — cut a new release branch"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stamp version.properties
        id: stamp
        run: |
          set -euo pipefail
          name='${{ steps.version.outputs.name }}'
          code=$(( $(grep '^versionCode=' version.properties | cut -d= -f2) + 1 ))
          sed -i "s/^versionName=.*/versionName=$name/" version.properties
          sed -i "s/^versionCode=.*/versionCode=$code/" version.properties
          echo "code=$code" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.properties
          # [skip ci] keeps this push from starting the whole workflow over again.
          git commit -m "chore: release $name ($code) [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"

      # The signing material, the backend credentials and the donation destinations only
      # exist as secrets. Writing them here keeps build.gradle.kts with exactly one way to
      # find them.
      - name: Restore signing, backend and donation configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
          # This is the build that carries the donation block — the APK on the Releases
          # page is the `direct` one, and without these three it would go out with nothing
          # to show, which is the whole feature missing rather than a build failure.
          # Deliberately not in the `required` list below: an empty destination is a
          # supported state everywhere else, and a release must not fail over one.
          DONATE_URL: ${{ secrets.DONATE_URL }}
          DONATE_SBP: ${{ secrets.DONATE_SBP }}
          DONATE_USDT: ${{ secrets.DONATE_USDT }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD BACKEND_URL BACKEND_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "::error::secret $required is not set"
              exit 1
            fi
          done
          # Worth saying out loud: a `direct` release with no destinations builds fine and
          # silently ships without the block, which is exactly the failure nobody notices.
          if [ -z "$DONATE_URL$DONATE_SBP$DONATE_USDT" ]; then
            echo "::warning::no DONATE_* secrets — this APK ships without the donation block"
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/dosmotr-release.jks
          # Written with a heredoc so nothing here lands in the log.
          cat > local.properties <<PROPS
          backend.url=$BACKEND_URL
          backend.token=$BACKEND_TOKEN
          donate.url=$DONATE_URL
          donate.sbp=$DONATE_SBP
          donate.usdt=$DONATE_USDT
          release.storeFile=keystore/dosmotr-release.jks
          release.storePassword=$KEYSTORE_PASSWORD
          release.keyAlias=$KEY_ALIAS
          release.keyPassword=$KEY_PASSWORD
          PROPS

      # Both flavours, because from here on both are shipped. Everywhere else in CI only
      # `direct` is tested (it is the superset), but the code that differs between them is
      # exactly the code nothing else covers: the donation block and `Telemetry`.
      - name: Run unit tests
        run: ./gradlew ${{ env.GRADLE_ARGS }} testDirectReleaseUnitTest testStoreReleaseUnitTest

      # Three artifacts out of one invocation. `direct` APK is what the Releases page carries
      # and what IzzyOnDroid picks up; Play accepts an AAB and nothing else; RuStore accepts
      # both and an APK is the simpler half. `assembleStoreRelease` and `bundleStoreRelease`
      # share `minifyStoreReleaseWithR8`, so this is two R8 runs (one per flavour), not three.
      - name: Build the release artifacts
        run: |
          set -euo pipefail
          # A store build without it has the Firebase SDK compiled in and no project to talk
          # to, so `FirebaseTelemetry` no-ops and no R8 mapping is uploaded: shipped stack
          # traces stay unreadable. Not fatal — CI and forks must keep building (see
          # ai-docs/distribution-and-legal.md) — but it must not be found out after upload.
          if [ ! -f app/src/store/google-services.json ]; then
            echo "::warning::no app/src/store/google-services.json — the store artifacts ship without crash reporting"
          fi
          ./gradlew ${{ env.GRADLE_ARGS }} \
            assembleDirectRelease assembleStoreRelease bundleStoreRelease

      # An unsigned or debug-signed artifact installs fine on a fresh phone and then refuses
      # to update the real one, so it is worth failing the release over. The three also have
      # to carry the *same* certificate: someone who installed from GitHub and later takes the
      # store build (or the other way round) gets a bare "app not installed" if they differ.
      # For Play this key is the upload key rather than the app signing key, which changes who
      # can recover it, not whether these three have to agree.
      - name: Verify the signatures
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.name }}'
          mv app/build/outputs/apk/direct/release/app-direct-release.apk "dosmotr-$version.apk"
          mv app/build/outputs/apk/store/release/app-store-release.apk "dosmotr-$version-store.apk"
          mv app/build/outputs/bundle/storeRelease/app-store-release.aab "dosmotr-$version-store.aab"

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          fingerprints=$(
            for apk in "dosmotr-$version.apk" "dosmotr-$version-store.apk"; do
              "$apksigner" verify --print-certs "$apk" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
            done
            # An AAB is jar-signed, not APK-signed, so apksigner cannot read it at all.
            # keytool prints the same digest colon-separated and upper case.
            keytool -printcert -jarfile "dosmotr-$version-store.aab" |
              sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z'
          )
          echo "$fingerprints"
          if [ "$(echo "$fingerprints" | sort -u | wc -l)" != 1 ] ||
             [ -z "$(echo "$fingerprints" | head -1)" ]; then
            echo "::error::the three artifacts are not signed with one key"
            exit 1
          fi

      # The DOD of feature-21, and part 7 of article 14 of 259-ФЗ for the wallet in
      # particular: a store build may carry no donation destination — not the link, not the
      # SBP phone, not the USDT address. `store` compiles the three fields as empty strings,
      # but that is a line in build.gradle.kts and these are the files that get uploaded, so
      # they are checked rather than trusted. The values are only ever tested for, never
      # printed, and the dex is unzipped to a file instead of piped: `grep -q` closes the pipe
      # early, which under pipefail would turn a match into a failed check.
      - name: Check the flavours are what they claim
        env:
          DONATE_URL: ${{ secrets.DONATE_URL }}
          DONATE_SBP: ${{ secrets.DONATE_SBP }}
          DONATE_USDT: ${{ secrets.DONATE_USDT }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.name }}'
          for artifact in "dosmotr-$version-store.apk" "dosmotr-$version-store.aab"; do
            dex=$(mktemp -d)
            unzip -qo "$artifact" '*.dex' -d "$dex"
            for name in DONATE_URL DONATE_SBP DONATE_USDT; do
              if [ -n "${!name}" ] && grep -aqrF -- "${!name}" "$dex"; then
                echo "::error::$artifact carries $name — a store build may not"
                exit 1
              fi
            done
            rm -rf "$dex"
          done

          # The mirror image, and the reason the warning above this job is not enough: an
          # empty destination is a supported state, so a `direct` release that lost the block
          # builds green and ships silently wrong.
          if [ -n "$DONATE_URL" ]; then
            dex=$(mktemp -d)
            unzip -qo "dosmotr-$version.apk" '*.dex' -d "$dex"
            if ! grep -aqrF -- "$DONATE_URL" "$dex"; then
              echo "::error::dosmotr-$version.apk has no donation link — the direct build lost its block"
              exit 1
            fi
            rm -rf "$dex"
          fi

      # Not attached to the GitHub Release on purpose: that page is the `direct` channel, and
      # a store APK sitting next to it is the build without the donation block that someone
      # installs by mistake. They go to the run's artifacts, which is where the RuStore and
      # Play Console uploads take them from — see store/publishing.md. 90 days covers a
      # moderation round-trip and a resubmission. These embed `BACKEND_TOKEN` in BuildConfig
      # exactly like the APK already published on the Releases page, so on a public repository
      # this is the same exposure, not a new one.
      - name: Upload the store artifacts for manual submission
        uses: actions/upload-artifact@v4
        with:
          name: store-release-${{ steps.version.outputs.name }}
          path: |
            dosmotr-${{ steps.version.outputs.name }}-store.aab
            dosmotr-${{ steps.version.outputs.name }}-store.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.version.outputs.name }}" \
            --target "$GITHUB_REF_NAME" \
            --title "Досмотр ${{ steps.version.outputs.name }}" \
            --notes "Сборка ${{ steps.version.outputs.name }} (versionCode ${{ steps.stamp.outputs.code }})." \
            --generate-notes \
            "dosmotr-${{ steps.version.outputs.name }}.apk"

      - name: Drop the secrets from the workspace
        if: always()
        run: rm -f local.properties keystore/dosmotr-release.jks

  # The release branch has to land in both long-lived branches: master is what is published,
  # develop needs the versionCode bump CI just committed or the next release repeats it.
  # These are pull requests with auto-merge on rather than direct pushes, because a merge
  # into master or develop stays a reviewable event (see CLAUDE.md) — auto-merge only
  # decides *when* it lands, once the branch protection checks are green.
  merge-back:
    name: Merge into ${{ matrix.base }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # Sequential: master first, so develop does not get a merge-back of a release that
      # failed to reach master.
      max-parallel: 1
      fail-fast: false
      matrix:
        base: [master, develop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Open the pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ matrix.base }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail

          # checkout only fetched the release branch, so the base has to be asked for.
          git fetch origin "$BASE"
          # Nothing to merge means gh pr create would fail rather than no-op — which happens
          # whenever the base already contains every commit of the release branch.
          if [ "$(git rev-list --count "origin/$BASE..HEAD")" = 0 ]; then
            echo "::notice::$BASE already contains $GITHUB_REF_NAME"
            exit 0
          fi

          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
                  --base "$BASE" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$GITHUB_REF_NAME" \
              --base "$BASE" \
              --title "Release $VERSION → $BASE" \
              --body "Automated merge-back of \`$GITHUB_REF_NAME\` after v$VERSION was published.
          Includes the \`versionCode\` bump CI committed to the release branch.")
          fi
          echo "::notice::$BASE ← $url"

          # Needs "Allow auto-merge" in the repository settings; without it the PR is still
          # open and waiting, which is the same outcome minus the convenience.
          if ! gh pr merge "$url" --auto --merge; then
            echo "::warning::auto-merge could not be enabled for $url — merge it by hand"
          fi
