# Tuned for an 8 GB machine: Gradle (which also runs R8/AAPT2) and the Kotlin
# daemon must fit alongside each other, or the OOM killer takes the build out.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
